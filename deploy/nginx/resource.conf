# NexaCP resource host — serves the v2 release layout
# Root: /var/www/nexacp-resource  (contains v2/stable/latest, v2/stable/<VERSION>/release/...)
server {
    listen 80;
    listen [::]:80;
    server_name resource.nexacp.in;

    root /var/www/nexacp-resource;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Installer scripts may be cached briefly; tarballs are immutable per version
    location ~* \.(tar\.gz|txt)$ {
        add_header Cache-Control "public, max-age=3600";
    }
}
